[project]
name = "doc-ingest-sdk"
version = "0.1.0"
description = "Typed Python client for the Document Ingest API."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doc_ingest_sdk"
