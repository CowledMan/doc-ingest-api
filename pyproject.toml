[project]
name = "doc-ingest-api"
version = "0.0.0"
description = "Document ingestion API workspace for M0 engine evaluation and benchmark scaffolding."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.13",
  "mypy>=1.18",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doc_ingest_api"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["anydoc.*", "markitdown.*", "docling.*"]
ignore_missing_imports = true
follow_imports = "skip"
