[project]
name = "doc-ingest-api"
version = "0.1.0"
description = "Document ingestion API gateway and parsing service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "docling==2.137.0",
    "firecrawl-anydoc==0.2.4",
    "markitdown[pdf]==0.1.8",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.3.0",  # official Model Context Protocol SDK; MIT
    "doc-ingest-sdk",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.13",
  "mypy>=1.18",
  "mkdocs-material>=9.7.7",
]

[project.scripts]
doc-ingest-mcp = "doc_ingest_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doc_ingest_api"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that use real parsing engines and benchmark samples",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["anydoc.*", "markitdown.*", "docling.*", "celery.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.uv.workspace]
members = ["sdk/python"]

[tool.uv.sources]
doc-ingest-sdk = { workspace = true }
