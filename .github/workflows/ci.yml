name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run mypy
        run: uv run mypy src benchmarks scripts sdk

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (no push)
        run: docker build --tag doc-ingest-api:ci .
      - name: Verify healthz responds
        run: |
          docker run --rm -d --name ci-test -p 8000:8000 doc-ingest-api:ci
          sleep 5
          curl -f http://localhost:8000/healthz || (docker logs ci-test && exit 1)
          docker stop ci-test
