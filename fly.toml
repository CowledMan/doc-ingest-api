# Fly.io deployment configuration
# Docs: https://fly.io/docs/reference/configuration/

app = "doc-ingest-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////app/data/doc_ingest.db"
  REDIS_URL = "redis://localhost:6379/0"
  QUEUE_BACKEND = "background"
  STRIPE_API_KEY = ""
  STRIPE_WEBHOOK_SECRET = ""
  ALIYUN_OCR_KEY = ""
  PARSER_TIMEOUT_SECONDS = "120"
  MONTHLY_PAGE_QUOTA = "500"
  RATE_LIMIT_IP_PER_HOUR = "10"
  RATE_LIMIT_KEY_PER_MINUTE = "60"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "doc_ingest_data"
  destination = "/app/data"

